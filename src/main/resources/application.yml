spring:
  application:
    name: cdm-core
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  main:
    banner-mode: console

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  info:
    env:
      enabled: true

# OpenAPI Specification Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
    tryItOutEnabled: true

cdm:
  servicenow:
    base-url: ${SERVICENOW_BASE_URL:https://example.service-now.com}
    table: ${SERVICENOW_TABLE:cmdb_ci_certificate}
    username: ${SERVICENOW_USERNAME:}
    password: ${SERVICENOW_PASSWORD:}
    client-id: ${SERVICENOW_CLIENT_ID:}
    client-secret: ${SERVICENOW_CLIENT_SECRET:}
    bearer-token: ${SERVICENOW_BEARER_TOKEN:}
    connect-timeout-ms: ${SERVICENOW_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${SERVICENOW_READ_TIMEOUT_MS:10000}
    max-retries: ${SERVICENOW_MAX_RETRIES:3}
    backoff-ms: ${SERVICENOW_BACKOFF_MS:1000}
    query-filter: ${SERVICENOW_QUERY_FILTER:active=true^ORDERBYDESCsys_updated_on}
    page-size: ${SERVICENOW_PAGE_SIZE:100}
    mock-enabled: ${SERVICENOW_MOCK_ENABLED:false}
  sectigo:
    base-url: ${SECTIGO_BASE_URL:https://cert-manager.com/api/v1}
    customer-uri: ${SECTIGO_CUSTOMER_URI:}
    login-name: ${SECTIGO_LOGIN_NAME:}
    password: ${SECTIGO_PASSWORD:}
    api-token: ${SECTIGO_API_TOKEN:}
    connect-timeout-ms: ${SECTIGO_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${SECTIGO_READ_TIMEOUT_MS:10000}
    max-retries: ${SECTIGO_MAX_RETRIES:3}
    backoff-ms: ${SECTIGO_BACKOFF_MS:1000}
    page-size: ${SECTIGO_PAGE_SIZE:100}
    certificates-path: ${SECTIGO_CERTIFICATES_PATH:/certificates}
    mock-enabled: ${SECTIGO_MOCK_ENABLED:false}
  matching:
    auto-match-threshold: ${MATCHING_AUTO_THRESHOLD:0.85}
    review-threshold: ${MATCHING_REVIEW_THRESHOLD:0.60}
    ambiguity-margin: ${MATCHING_AMBIGUITY_MARGIN:0.05}
    san-weight: ${MATCHING_SAN_WEIGHT:0.35}
    cn-weight: ${MATCHING_CN_WEIGHT:0.25}
    renewal-linkage-weight: ${MATCHING_RENEWAL_WEIGHT:0.20}
    lifecycle-weight: ${MATCHING_LIFECYCLE_WEIGHT:0.10}
    issuer-weight: ${MATCHING_ISSUER_WEIGHT:0.10}
    reject-expired-candidates: ${MATCHING_REJECT_EXPIRED:true}
    require-validity-extension: ${MATCHING_REQUIRE_EXTENSION:true}
    allow-wildcard-expansion: ${MATCHING_ALLOW_WILDCARD:true}
  deployment:
    planner:
      enabled: ${DEPLOYMENT_PLANNER_ENABLED:true}
      default-max-retries: ${DEPLOYMENT_MAX_RETRIES:3}
      critical-threshold-days: ${DEPLOYMENT_CRITICAL_THRESHOLD_DAYS:7}
      high-threshold-days: ${DEPLOYMENT_HIGH_THRESHOLD_DAYS:15}
      allow-manual-review-override: ${DEPLOYMENT_ALLOW_REVIEW_OVERRIDE:false}
      require-active-mid-server: ${DEPLOYMENT_REQUIRE_ACTIVE_MID:true}
      default-port: ${DEPLOYMENT_DEFAULT_PORT:443}
  midserver:
    base-url: ${MID_SERVER_BASE_URL:https://mid-server.grassroots.internal:8443}
    auth-type: ${MID_SERVER_AUTH_TYPE:BEARER}
    bearer-token: ${MID_SERVER_BEARER_TOKEN:}
    username: ${MID_SERVER_USERNAME:}
    password: ${MID_SERVER_PASSWORD:}
    api-key: ${MID_SERVER_API_KEY:}
    api-key-header: ${MID_SERVER_API_KEY_HEADER:X-MID-API-KEY}
    connect-timeout-ms: ${MID_SERVER_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${MID_SERVER_READ_TIMEOUT_MS:10000}
    max-retries: ${MID_SERVER_MAX_RETRIES:3}
    backoff-ms: ${MID_SERVER_BACKOFF_MS:1000}
    mock-enabled: ${MID_SERVER_MOCK_ENABLED:false}
    jobs-path: ${MID_SERVER_JOBS_PATH:/api/v1/mid/jobs}
    execution-timeout-seconds: ${MID_SERVER_EXECUTION_TIMEOUT_SECONDS:300}

logging:
  pattern:
    console: "%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx"

